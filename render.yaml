services:
  - type: web
    name: access360
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health-check
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # Your Neon connection string (postgresql://...)
      - key: NEXTAUTH_URL
        sync: false          # https://your-app.onrender.com
      - key: NEXTAUTH_SECRET
        sync: false          # Long random string
      - key: ADMIN_SECRET_CODE
        sync: false          # Registration code
      - key: GROQ_API_KEY
        sync: false          # Groq API key
      - key: OPENAI_API_KEY
        sync: false          # OpenAI API key
      - key: ADMIN_SETUP_SECRET
        sync: false          # Setup secret
